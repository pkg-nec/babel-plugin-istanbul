name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install latest npm 11
        run: npm install --global npm@^11

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$package_version' (expected '$expected_tag')."
            exit 1
          fi

      - name: Run test suite
        run: yarn test

      - name: Publish with npm provenance
        run: npm publish --access public --provenance
